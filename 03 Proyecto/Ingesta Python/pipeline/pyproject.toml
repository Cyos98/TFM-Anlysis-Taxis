[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-nyc-mobility-pipeline"
version = "0.2.0"
description = "Pipeline reproducible del TFM de movilidad de Nueva York"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "psycopg[binary]==3.2.9",
    "pyarrow==17.0.0",
    "typing-extensions==4.12.2",
]

[project.scripts]
tfm-pipeline = "nyc_taxi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
