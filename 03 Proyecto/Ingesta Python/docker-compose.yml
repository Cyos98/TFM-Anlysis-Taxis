name: tfm-nyc-mobility-python-legacy

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfm_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-tfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  pipeline:
    build:
      context: ..
      dockerfile: Ingesta Python/docker/pipeline/Dockerfile
      target: pipeline
    environment:
      TFM_ENVIRONMENT: ${TFM_ENVIRONMENT:-local}
      TFM_CONFIG_PATH: ${TFM_CONFIG_PATH:-/app/configs/pipeline.toml}
      TFM_DATA_ROOT: ${TFM_DATA_ROOT:-/app/data}
      TFM_LOGS_ROOT: ${TFM_LOGS_ROOT:-/app/logs}
      TFM_SQL_ROOT: /app/sql/init
      TFM_DATABASE_HOST: postgres
      TFM_DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tfm_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-tfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - ./configs:/app/configs:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../ml/artifacts:/app/ml/artifacts
      - ../sql:/app/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["service"]
    healthcheck:
      test: ["CMD", "python", "-m", "nyc_taxi_pipeline", "validate-config"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    init: true
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: Ingesta Python/docker/pipeline/Dockerfile
      target: scheduler
    environment:
      TFM_ENVIRONMENT: ${TFM_ENVIRONMENT:-local}
      TFM_CONFIG_PATH: /app/configs/pipeline.toml
      TFM_DATA_ROOT: /app/data
      TFM_LOGS_ROOT: /app/logs
      TFM_SQL_ROOT: /app/sql/init
      TFM_DATABASE_HOST: postgres
      TFM_DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tfm_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-tfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      DBT_PROFILES_DIR: /app/dbt
      TFM_SCHEDULE_CRON: "${TFM_SCHEDULE_CRON:-0 3 * * *}"
    volumes:
      - ./configs:/app/configs:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../sql:/app/sql:ro
      - ../dbt:/app/dbt
      - ../ml/artifacts:/app/ml/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_healthy
    init: true
    restart: unless-stopped

  superset-init:
    image: apache/superset:6.0.0-dev
    environment: &superset-environment
      SUPERSET_CONFIG_PATH: /app/superset/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_me_with_a_long_random_value_before_sharing_123456}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change_me_local_only}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.invalid}
      POSTGRES_DB: ${POSTGRES_DB:-tfm_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-tfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      SCARF_ANALYTICS: "false"
    volumes:
      - ../superset:/app/superset:ro
      - ../superset/exports:/app/exports
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/bash", "/app/superset/init.sh"]
    restart: "no"

  superset:
    image: apache/superset:6.0.0-dev
    environment: *superset-environment
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ../superset:/app/superset:ro
      - ../superset/exports:/app/exports
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    profiles: ["tools"]
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tfm_mobility}
      POSTGRES_USER: ${POSTGRES_USER:-tfm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - ../dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["dbt"]
    command: ["--version"]

volumes:
  postgres_data:
    name: tfm_nyc_mobility_python_legacy_postgres_data
  superset_home:
    name: tfm_nyc_mobility_python_legacy_superset_home
