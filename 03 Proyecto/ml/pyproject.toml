[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-nyc-mobility-ml"
version = "0.3.0"
description = "Servicio reproducible de predicción de demanda del TFM"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.4.2",
    "numpy==1.26.4",
    "psycopg[binary]==3.2.9",
    "scikit-learn==1.5.2",
]

[project.scripts]
tfm-ml = "nyc_taxi_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
